<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Inicial</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.formulario.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">WebApp Usuarios</a>
            <a class="nav-link text-white" href="index.html">Ver usuarios</a>
        </div>
    </nav>

    <div class="container">
        <form id="form_registro" novalidate>
            <h3>Formulario Registro</h3>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="input_nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="input_nombre" placeholder="Ingrese nombre usuario" required>
                    <div class="invalid-feedback">Ingrese un nombre válido.</div>
                </div>
                <div class="col-md-6">
                    <label for="input_usuario" class="form-label">Usuario:</label>
                    <input type="text" class="form-control" id="input_usuario" placeholder="Ingrese nombre de usuario" required>
                    <div class="invalid-feedback">Ingrese un usuario válido.</div>
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label for="input_fecha_ingreso" class="form-label">Fecha Ingreso:</label>
                    <input type="date" class="form-control" id="input_fecha_ingreso" required>
                    <div class="invalid-feedback">Ingrese una fecha válida.</div>
                </div>
                <div class="col-md-6">
                    <label for="input_email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="input_email" placeholder="usuario@servidor.dom" required>
                    <div class="invalid-feedback">Ingrese un email válido.</div>
                </div>
            </div>

            <div class="mt-3">
                <label for="input_sitio_web" class="form-label">Sitio Web:</label>
                <input type="url" class="form-control" id="input_sitio_web" placeholder="https://example.com">
                <div class="invalid-feedback">Ingrese una URL válida.</div>
            </div>

            <div class="mt-4 text-end">
                <button type="button" id="btn_cancelar" class="btn btn-secondary">Cancelar</button>
                <button type="submit" id="btn_enviar" class="btn btn-primary">Enviar</button>
            </div>
        </form>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/procesar_formulario.js"></script>
</body>
</html>
