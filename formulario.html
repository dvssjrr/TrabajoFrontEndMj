<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Inicial</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark text-light">
    <div class="container">
        <div class="row">
        <div class="col">Navegacion...</div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col col-3"></div>
            <div class="col col-9">
                <form id="form_registro" action="" method="post">
                    <div class="row">
                    <div class="col">
                    <h3>Formulario Registro</h3>
                    </div>
                    </div>
                    <br>

                    <div class="row">
                        <div class="col">
                        <label for="input_nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control bg-white text-dark" name="nombre" id="input_nombre"
                        placeholder="Ingrese su nombre" required>
                        </div>

                        <div class="col">
                        <label for="input_rut" class="form-label">RUT:</label>
                        <input type="text" class="form-control bg-white text-dark" name="rut" id="input_rut"
                        placeholder="Ingrese su RUT" required>
                        </div>
                    </div>
                    <br>

                    <div class="row">
                        <div class="col">
                        <label for="input_email" class="form-label">Email:</label>
                        <input type="email" class="form-control bg-white text-dark" name="email" id="input_email"
                        placeholder="Ingrese su email" required>
                        </div>
                    </div>
                    <br>

                    <div class="row">
                        <div class="col">
                        <label for="input_fecha_nacimiento" class="form-label">Fecha de nacimiento:</label>
                        <input type="date" class="form-control bg-white text-dark" name="fecha_nacimiento" id="input_fecha_nacimiento" required>
                        </div>
                        <div class="col">
                        <label class="form-label d-block">Género:</label>
                        <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genero" id="genero_m" value="masculino" required>
                            <label class="form-check-label" for="genero_m">Masculino</label>
                        </div>
                         <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genero" id="genero_f" value="femenino">
                         <label class="form-check-label" for="genero_f">Femenino</label>
                        </div>
                        <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genero" id="genero_o" value="otro">
                        <label class="form-check-label" for="genero_o">Otro</label>
                        </div>
                            
                        </div>
                    </div>
                    <br>

                    <div class="row">
                        <div class="col">
                        <label for="input_contrasena" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control bg-white text-dark" name="contrasena" id="input_contrasena"
                         placeholder="Ingrese contraseña" required>
                        </div>
                        <div class="col">
                        <label for="input_confirm_contrasena" class="form-label">Confirme Contraseña:</label>
                        <input type="password" class="form-control bg-white text-dark" name="confirmacion_contrasena" id="input_confirm_contrasena"
                        placeholder="Repite contraseña" required>
                        </div>

                    </div>

                    <br>
                    <div class="row">
                        <div class="col"></div>
                        <div class="col">
                        <input type="button" class="btn btn-secondary" value="Cancelar">
                        <input type="submit" class="btn btn-primary" value="Enviar">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/procesar_form.js"></script>
</body>

</html>
